[package]
name = "cargo-dragons"
version = "1.0.0-alpha.8"
authors = [
  "Bernhard Schuster <bernhard@ahoi.io>",
  "Benjamin Kampmann <ben@gnunicorn.org>",
]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0"
repository = "https://github.com/drahnr/cargo-dragons"
description = "Tooling to manage releasing of crates in massiv workspaces/monorepos"
readme = "README.md"
keywords = ["cargo", "publishing", "dragons", "workspaces", "monorepo"]
categories = ["development-tools", "development-tools::cargo-plugins"]

exclude = [".gitignore", ".github/**"]

[[bin]]
name = "cargo-dragons"
path = "src/main.rs"

[features]
default = []
gen-readme = ["dep:cargo-readme", "dep:lazy_static", "dep:sha1"]

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.7"
clap-verbosity-flag = "3.0.4"

toml_edit = "0.25.12"
toml = { version = "1.1.2", features = ["preserve_order"] }
log = "0.4.33"
pretty_env_logger = "0.5.0"
petgraph = "0.8.3"
regex = "1.13.0"
anyhow = "1.0.103"
itertools = "0.15.0"

# Cargo implementation APIs: update and pin these as a unit.
cargo = { version = "=0.98.0", features = [] }
cargo-credential = "=0.4.10"
cargo-util-schemas = "=0.14.1"
cargo-util-terminal = "=0.1.0"
futures = "0.3.32"

flate2 = "1.1.9"
git2 = "0.21.0"
semver = "1.0.28"
tar = "0.4.46"

# Optional dependencies
cargo-readme = { version = "3.3.2", optional = true }
lazy_static = { version = "1.5.0", optional = true }
sha1 = { version = "0.11.0", optional = true }
colorize = "0.1.0"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
assert_matches = "1.5.0"
fs-err = "3.1.3"
tempfile = "3.27.0"
